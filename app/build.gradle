plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlinx-serialization'
}

android {
    namespace = "com.example.ailearning"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.example.ailearning"
        minSdk = 26
        targetSdk = 34
        versionCode = 19
        versionName = "1.6.6"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        create("release") {
            def storePath = System.getenv("KEYSTORE_PATH") ?: ""
            def storePass = System.getenv("KEYSTORE_PASSWORD") ?: ""
            def keyAliasName = System.getenv("KEY_ALIAS") ?: ""
            def keyPass = System.getenv("KEY_PASSWORD") ?: ""
            if (storePath && storePass && keyAliasName && keyPass) {
                storeFile = file(storePath)
                storePassword = storePass
                keyAlias = keyAliasName
                keyPassword = keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig = signingConfigs.getByName("release")
        }
        debug {
            minifyEnabled = false
            debuggable = true
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-Xopt-in=kotlin.RequiresOptIn",
            "-Xopt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
            "-Xopt-in=androidx.lifecycle.ExperimentalLifecycleApi",
            "-Xopt-in=androidx.compose.runtime.ExperimentalComposeApi",
            "-Xopt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-Xopt-in=androidx.datastore.ExperimentalDatastoreApi"
        ]
    }

    buildFeatures {
        compose = true
        viewBinding = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }

    packaging {
        resources.excludes += "META-INF/*.kotlin_module"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

